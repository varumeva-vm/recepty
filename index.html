<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Банк рецептов</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2622;--mute:#857a70;--line:#e8e0d6;--acc:#c0562b;--chip:#f3ebe2}
@media (prefers-color-scheme:dark){:root{--bg:#1b1917;--card:#252220;--ink:#eee7df;--mute:#a09488;--line:#3a3430;--acc:#e4825a;--chip:#322c28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{max-width:900px;margin:0 auto;padding:24px 16px 8px}
h1{margin:0 0 12px;font-size:26px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
.tag.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:900px;margin:0 auto;padding:8px 16px 40px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.card h2{margin:0 0 4px;font-size:18px}
.meta{color:var(--mute);font-size:14px}
.kbju{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.k{background:var(--chip);border-radius:8px;padding:2px 8px;font-size:13px}
.body{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.card.open .body{display:block}
h3{font-size:15px;margin:12px 0 4px;color:var(--acc)}
ul,ol{margin:0;padding-left:20px}
.empty{color:var(--mute);text-align:center;padding:40px}
</style>
</head>
<body>
<header>
<h1>Банк рецептов</h1>
<input id="q" placeholder="Поиск: название или ингредиент">
<div class="tags" id="tags"></div>
</header>
<main id="list"><div class="empty">Загружаю…</div></main>
<script>
const SHEET="18u-5dcQHyhi7LJoIhxwnIQ1cB7TkORRrRCQmLC1ppk4";
const URL_CSV=`https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("Лист1")}`;
let all=[],tag=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lines=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
function kbju(r){
  const p=r["Ккал/порц"]?["порция",r["Ккал/порц"],r["Б/порц"],r["Ж/порц"],r["У/порц"]]
        :r["Ккал/100г"]?["100 г",r["Ккал/100г"],r["Б/100г"],r["Ж/100г"],r["У/100г"]]:null;
  if(!p)return"";
  return `<div class="kbju"><span class="k">${p[1]} ккал / ${p[0]}</span><span class="k">Б ${p[2]}</span><span class="k">Ж ${p[3]}</span><span class="k">У ${p[4]}</span></div>`;
}
function render(){
  const q=document.getElementById("q").value.toLowerCase().trim();
  const rows=all.filter(r=>(!tag||r._tags.includes(tag))&&(!q||(r["Название"]+" "+r["Ингредиенты"]+" "+r["Теги"]).toLowerCase().includes(q)));
  const el=document.getElementById("list");
  if(!rows.length){el.innerHTML='<div class="empty">Ничего не найдено</div>';return}
  el.innerHTML=rows.map(r=>{
    const m=[r["Порций"]&&`${r["Порций"]} порц.`,r["Время, мин"]&&`${r["Время, мин"]} мин`,r["Температура, °C"]&&`${r["Температура, °C"]} °C`].filter(Boolean).join(" · ");
    const steps=lines(r["Шаги"]).map(s=>s.replace(/^\d+\.\s*/,""));
    return `<div class="card"><h2>${esc(r["Название"])}</h2><div class="meta">${esc(m)}${m&&r["Теги"]?" · ":""}${esc(r["Теги"])}</div>${kbju(r)}
    <div class="body"><h3>Ингредиенты</h3><ul>${lines(r["Ингредиенты"]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <h3>Приготовление</h3><ol>${steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
    ${r["Заметки"]?`<h3>Заметки</h3><p>${esc(r["Заметки"])}</p>`:""}
    ${r["Источник"]?`<p class="meta">Источник: ${esc(r["Источник"])}</p>`:""}</div></div>`}).join("");
  el.querySelectorAll(".card").forEach(c=>c.onclick=()=>c.classList.toggle("open"));
}
function tags(){
  const set=[...new Set(all.flatMap(r=>r._tags))].sort();
  const el=document.getElementById("tags");
  el.innerHTML=set.map(t=>`<button class="tag${t===tag?" on":""}">${esc(t)}</button>`).join("");
  el.querySelectorAll(".tag").forEach(b=>b.onclick=()=>{tag=tag===b.textContent?null:b.textContent;tags();render()});
}
Papa.parse(URL_CSV,{download:true,header:true,skipEmptyLines:true,
  complete:res=>{all=res.data.filter(r=>r["Название"]).map(r=>({...r,_tags:lines((r["Теги"]||"").replace(/,/g,"\n"))})).reverse();tags();render()},
  error:()=>{document.getElementById("list").innerHTML='<div class="empty">Не удалось загрузить таблицу</div>'}});
document.getElementById("q").oninput=render;
</script>
</body>
</html>
